<div class="border-4 border-blue-600 rounded-lg p-4 bg-slate-300 shadow-md flex flex-col justify-between h-full">
  <div class="overflow-x-auto bg-white rounded border border-gray-400 mb-4 min-h-[160px]">
    <table class="w-full text-sm text-left border-collapse">
      <thead class="bg-gray-200 text-gray-800 border-b border-gray-400">
        <tr>
          <th class="p-2 border-r">Tamaño</th>
          <th class="p-2 border-r">Ingredientes</th>
          <th class="p-2 border-r">Núm. Pizzas</th>
          <th class="p-2">SubTotal</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of (pizzeriaService.detalles$ | async); let i = index" 
            (click)="seleccionarFila(i)"
            [class.bg-blue-200]="indexSeleccionado === i"
            class="hover:bg-gray-100 cursor-pointer border-b text-gray-900 font-medium">
          <td class="p-2 border-r">{{ item.tamano }}</td>
          <td class="p-2 border-r">{{ item.ingredientes.join(', ') || 'Ninguno' }}</td>
          <td class="p-2 border-r">{{ item.numPizzas }}</td>
          <td class="p-2">${{ item.subtotal }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-around gap-4">
    <button type="button" (click)="quitar()" class="bg-gray-100 hover:bg-white text-gray-900 border border-gray-500 font-bold px-6 py-2 rounded shadow">
      Quitar
    </button>
    <button type="button" (click)="terminar()" class="bg-gray-100 hover:bg-white text-gray-900 border border-gray-500 font-bold px-6 py-2 rounded shadow">
      Terminar
    </button>
  </div>
</div>
